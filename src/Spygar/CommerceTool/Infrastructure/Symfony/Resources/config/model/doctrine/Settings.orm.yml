Spygar\CommerceTool\Domain\Model\Settings:
    type: entity
    table: spygar_commercetool_settings
    repositoryClass: Spygar\CommerceTool\Infrastructure\Persistence\SettingsRepository
    changeTrackingPolicy: DEFERRED_EXPLICIT
    fields:
        id:
            type: integer
            id: true
            generator:
                strategy: AUTO
        code:
            type: string
            length: 100
            unique: true
        enabled:
            type: boolean
        exportProducts:
            type: boolean
            column: export_products
        exportCategories:
            type: boolean
            column: export_categories
        importProducts:
            type: boolean
            column: import_products
        debug:
            type: boolean
        createdAt:
            type: datetime_immutable
            column: created_at
        updatedAt:
            type: datetime_immutable
            column: updated_at
