Spygar\CommerceTool\Domain\Model\Credential:
    type: entity
    table: spygar_commercetool_credential
    repositoryClass: Spygar\CommerceTool\Infrastructure\Persistence\CredentialRepository
    changeTrackingPolicy: DEFERRED_EXPLICIT
    fields:
        id:
            type: integer
            id: true
            generator:
                strategy: AUTO
        code:
            type: string
            length: 100
            unique: true
        label:
            type: string
            length: 255
        projectKey:
            type: string
            length: 255
            column: project_key
        clientId:
            type: string
            length: 255
            column: client_id
        clientSecret:
            type: text
            column: client_secret
        region:
            type: string
            length: 100
            nullable: true
        authUrl:
            type: string
            length: 255
            nullable: true
            column: auth_url
        apiUrl:
            type: string
            length: 255
            nullable: true
            column: api_url
        scope:
            type: text
            nullable: true
        active:
            type: boolean
        createdAt:
            type: datetime_immutable
            column: created_at
        updatedAt:
            type: datetime_immutable
            column: updated_at
