extensions:
    pim-commercetool-import-job-edit:
        module: pim/form/common/edit-form

    pim-commercetool-import-job-edit-main-image:
        module: pim/form/common/main-image
        parent: pim-commercetool-import-job-edit
        targetZone: main-image
        config:
            path: bundles/pimui/images/illustrations/ImportCSV.svg

    pim-commercetool-import-job-edit-user-navigation:
        module: pim/menu/user-navigation
        parent: pim-commercetool-import-job-edit
        targetZone: user-menu
        config:
            userAccount: pim_menu.user.user_account
            logout: pim_menu.user.logout

    pim-commercetool-import-job-edit-sandbox-helper:
        module: pim/sandbox-helper
        parent: pim-commercetool-import-job-edit
        targetZone: helper

    pim-commercetool-import-job-edit-breadcrumbs:
        module: pim/job/common/breadcrumb/breadcrumb
        parent: pim-commercetool-import-job-edit
        targetZone: breadcrumbs
        config:
            isEdit: true

    pim-commercetool-import-job-edit-cache-invalidator:
        module: pim/cache-invalidator
        parent: pim-commercetool-import-job-edit
        position: 1000

    pim-commercetool-import-job-edit-tabs:
        module: pim/form/common/form-tabs
        parent: pim-commercetool-import-job-edit
        targetZone: content
        position: 100

    pim-commercetool-import-job-edit-properties:
        module: pim/job/common/edit/properties
        parent: pim-commercetool-import-job-edit-tabs
        aclResourceId: pim_importexport_export_profile_property_edit
        targetZone: container
        position: 100
        config:
            tabTitle: pim_common.properties
            tabCode: pim-job-instance-properties

    pim-commercetool-import-job-edit-history:
        module: pim/common/tab/history
        parent: pim-commercetool-import-job-edit-tabs
        targetZone: container
        aclResourceId: pim_importexport_import_profile_history
        position: 120
        config:
            class: Akeneo\Tool\Component\Batch\Model\JobInstance
            title: pim_common.history
            tabCode: pim-job-instance-history

    pim-commercetool-import-job-edit-properties-code:
        module: pim/job/common/edit/field/text
        parent: pim-commercetool-import-job-edit-properties
        position: 100
        targetZone: properties
        config:
            fieldCode: code
            label: pim_common.code
            readOnly: true

    pim-commercetool-import-job-edit-properties-label:
        module: pim/job/common/edit/field/text
        parent: pim-commercetool-import-job-edit-properties
        position: 110
        targetZone: properties
        config:
            fieldCode: label
            label: pim_common.label
            readOnly: false

    pim-commercetool-import-job-edit-properties-credential:
        module: spygar/commercetool/job/credential
        parent: pim-commercetool-import-job-edit-properties
        position: 120
        targetZone: properties
        config:
            fieldCode: configuration.credential
            label: spygar_commercetool.job.credential
            tooltip: spygar_commercetool.job.credential_help
            readOnly: false

    pim-commercetool-import-job-edit-label:
        module: pim/job/common/edit/label
        parent: pim-commercetool-import-job-edit
        targetZone: title
        position: 100

    pim-commercetool-import-job-edit-meta:
        module: pim/job/common/edit/meta
        parent: pim-commercetool-import-job-edit
        targetZone: meta
        position: 100

    pim-commercetool-import-job-edit-secondary-actions:
        module: pim/form/common/secondary-actions
        parent: pim-commercetool-import-job-edit
        targetZone: buttons
        position: 50

    pim-commercetool-import-job-edit-delete:
        module: pim/job/import/edit/delete
        parent: pim-commercetool-import-job-edit-secondary-actions
        targetZone: secondary-actions
        aclResourceId: pim_importexport_import_profile_remove
        position: 100
        config:
            trans:
                title: confirmation.remove.import_profile
                content: pim_common.confirm_deletion
                success: pim_import_export.entity.job_instance.flash.delete.success
                failed: error.removing.job_instance
            redirect: pim_importexport_import_profile_index

    pim-commercetool-import-job-edit-duplicate:
        module: pim/job/common/duplicate/duplicate
        parent: pim-commercetool-import-job-edit-secondary-actions
        targetZone: secondary-actions
        aclResourceId: pim_importexport_import_profile_create
        position: 80
        config:
            subTitle: pim_menu.tab.imports
            editRoute: pim_importexport_import_profile_edit

    pim-commercetool-import-job-edit-save-buttons:
        module: pim/form/common/save-buttons
        parent: pim-commercetool-import-job-edit
        targetZone: buttons
        position: 120

    pim-commercetool-import-job-edit-save:
        module: pim/job-instance-import-edit-form/save
        parent: pim-commercetool-import-job-edit
        targetZone: buttons
        position: 0
        config:
            redirectPath: pim_importexport_import_profile_show

    pim-commercetool-import-job-edit-state:
        module: pim/form/common/state
        parent: pim-commercetool-import-job-edit
        targetZone: state
        position: 900
        config:
            entity: pim_import_export.entity.job_instance.label

    pim-commercetool-import-job-edit-validation:
        module: pim/job/common/edit/validation
        parent: pim-commercetool-import-job-edit
