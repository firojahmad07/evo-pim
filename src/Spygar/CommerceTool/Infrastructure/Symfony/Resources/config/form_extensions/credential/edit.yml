extensions:
    pim-commercetool-credential-edit-form:
        module: pim/form/common/edit-form

    pim-commercetool-credential-edit-form-breadcrumbs:
        module: pim/common/breadcrumbs
        parent: pim-commercetool-credential-edit-form
        targetZone: breadcrumbs
        config:
            tab: pim-menu-connect
            item: spygar-connector-commercetool-spygar_commercetool_credential_index

    pim-commercetool-credential-edit-form-user-navigation:
        module: pim/menu/user-navigation
        parent: pim-commercetool-credential-edit-form
        targetZone: user-menu
        config:
            userAccount: pim_menu.user.user_account
            logout: pim_menu.user.logout

    pim-commercetool-credential-edit-form-cache-invalidator:
        module: pim/cache-invalidator
        parent: pim-commercetool-credential-edit-form
        position: 1000

    pim-commercetool-credential-edit-form-label:
        module: pim/form/common/label
        parent: pim-commercetool-credential-edit-form
        targetZone: title
        position: 110
        config:
            field: code

    pim-commercetool-credential-edit-form-secondary-actions:
        module: pim/form/common/secondary-actions
        parent: pim-commercetool-credential-edit-form
        targetZone: buttons
        position: 50

    pim-commercetool-credential-edit-form-delete:
        module: spygar/commercetool/form/credential-delete
        parent: pim-commercetool-credential-edit-form-secondary-actions
        targetZone: secondary-actions
        aclResourceId: spygar_commercetool_credential_remove
        position: 100
        config:
            trans:
                title: spygar_commercetool.credential.delete.confirm
                subTitle: spygar_commercetool.credential.entity
                content: pim_common.confirm_deletion
                success: spygar_commercetool.credential.flash.delete.success
                fail: spygar_commercetool.credential.flash.delete.fail
                buttonText: pim_common.delete
            redirect: spygar_commercetool_credential_index

    pim-commercetool-credential-edit-form-save-buttons:
        module: pim/form/common/save-buttons
        parent: pim-commercetool-credential-edit-form
        targetZone: buttons
        position: 100

    pim-commercetool-credential-edit-form-save:
        module: pim/form/common/save-form
        parent: pim-commercetool-credential-edit-form
        targetZone: buttons
        position: 0
        config:
            updateSuccessMessage: spygar_commercetool.credential.flash.update.success
            updateFailureMessage: spygar_commercetool.credential.flash.update.fail
            notReadyMessage: spygar_commercetool.credential.flash.update.not_ready
            url: spygar_commercetool_credential_rest_post

    pim-commercetool-credential-edit-form-state:
        module: pim/form/common/state
        parent: pim-commercetool-credential-edit-form
        targetZone: state
        position: 900
        config:
            entity: spygar_commercetool.credential.entity

    pim-commercetool-credential-edit-form-tabs:
        module: pim/form/common/form-tabs
        parent: pim-commercetool-credential-edit-form
        targetZone: content
        position: 90

    pim-commercetool-credential-edit-form-properties-tab:
        module: pim/common/tab
        parent: pim-commercetool-credential-edit-form-tabs
        targetZone: container
        position: 100
        config:
            label: pim_common.properties

    pim-commercetool-credential-edit-form-properties:
        module: pim/common/simple-view
        parent: pim-commercetool-credential-edit-form-properties-tab
        targetZone: self
        config:
            template: pim/template/form/tab/sections

    pim-commercetool-credential-edit-form-properties-general:
        module: pim/common/properties/general
        parent: pim-commercetool-credential-edit-form-properties
        targetZone: accordion
        position: 100
        config:
            sectionTitle: pim_common.general_properties
            codeLabel: pim_common.code
            formRequired: pim_common.required_label
            inputField: spygar_commercetool_credential_code

    pim-commercetool-credential-edit-form-properties-section:
        module: pim/common/simple-view
        parent: pim-commercetool-credential-edit-form-properties
        targetZone: accordion
        position: 110
        config:
            template: pim/template/form/tab/section
            templateParams:
                sectionTitle: spygar_commercetool.credential.section
                dropZone: content

    pim-commercetool-credential-edit-form-label-field:
        module: pim/form/common/fields/text
        parent: pim-commercetool-credential-edit-form-properties-section
        targetZone: content
        position: 10
        config:
            fieldName: label
            label: spygar_commercetool.credential.field.label
            required: true

    pim-commercetool-credential-edit-form-project-key:
        module: pim/form/common/fields/text
        parent: pim-commercetool-credential-edit-form-properties-section
        targetZone: content
        position: 20
        config:
            fieldName: project_key
            label: spygar_commercetool.credential.field.project_key
            required: true

    pim-commercetool-credential-edit-form-client-id:
        module: pim/form/common/fields/text
        parent: pim-commercetool-credential-edit-form-properties-section
        targetZone: content
        position: 30
        config:
            fieldName: client_id
            label: spygar_commercetool.credential.field.client_id
            required: true

    pim-commercetool-credential-edit-form-client-secret:
        module: pim/form/common/fields/password
        parent: pim-commercetool-credential-edit-form-properties-section
        targetZone: content
        position: 40
        config:
            fieldName: client_secret
            label: spygar_commercetool.credential.field.client_secret

    pim-commercetool-credential-edit-form-region:
        module: pim/form/common/fields/text
        parent: pim-commercetool-credential-edit-form-properties-section
        targetZone: content
        position: 50
        config:
            fieldName: region
            label: spygar_commercetool.credential.field.region

    pim-commercetool-credential-edit-form-auth-url:
        module: pim/form/common/fields/text
        parent: pim-commercetool-credential-edit-form-properties-section
        targetZone: content
        position: 60
        config:
            fieldName: auth_url
            label: spygar_commercetool.credential.field.auth_url

    pim-commercetool-credential-edit-form-api-url:
        module: pim/form/common/fields/text
        parent: pim-commercetool-credential-edit-form-properties-section
        targetZone: content
        position: 70
        config:
            fieldName: api_url
            label: spygar_commercetool.credential.field.api_url

    pim-commercetool-credential-edit-form-scope:
        module: pim/form/common/fields/textarea
        parent: pim-commercetool-credential-edit-form-properties-section
        targetZone: content
        position: 80
        config:
            fieldName: scope
            label: spygar_commercetool.credential.field.scope

    pim-commercetool-credential-edit-form-active:
        module: pim/form/common/fields/boolean
        parent: pim-commercetool-credential-edit-form-properties-section
        targetZone: content
        position: 90
        config:
            fieldName: active
            label: spygar_commercetool.credential.field.active

    pim-commercetool-credential-edit-form-mapping-tab:
        module: pim/common/tab
        parent: pim-commercetool-credential-edit-form-tabs
        targetZone: container
        position: 110
        config:
            label: spygar_commercetool.credential.tab.mapping

    pim-commercetool-credential-edit-form-mapping:
        module: pim/common/simple-view
        parent: pim-commercetool-credential-edit-form-mapping-tab
        targetZone: self
        config:
            template: pim/template/common/form-container

    pim-commercetool-credential-edit-form-reference:
        module: spygar/commercetool/form/credential-reference
        parent: pim-commercetool-credential-edit-form-mapping
        targetZone: form-container
        position: 100
