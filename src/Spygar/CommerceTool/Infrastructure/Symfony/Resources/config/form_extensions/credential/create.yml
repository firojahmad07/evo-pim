extensions:
    pim-commercetool-credential-create-modal:
        module: pim/form/common/creation/modal
        config:
            labels:
                title: pim_common.create
                subTitle: spygar_commercetool.credential.entity
            picture: illustrations/Api.svg
            successMessage: spygar_commercetool.credential.flash.create.success
            editRoute: spygar_commercetool_credential_edit
            postUrl: spygar_commercetool_credential_rest_create
            routerKey: identifier
            entityIdentifierParamName: code

    pim-commercetool-credential-create-label:
        module: spygar/commercetool/form/credential-field
        parent: pim-commercetool-credential-create-modal
        targetZone: fields
        position: 10
        config:
            identifier: label
            label: Name
            plainLabel: true

    pim-commercetool-credential-create-project-key:
        module: spygar/commercetool/form/credential-field
        parent: pim-commercetool-credential-create-modal
        targetZone: fields
        position: 30
        config:
            identifier: project_key
            label: spygar_commercetool.credential.field.project_key

    pim-commercetool-credential-create-client-id:
        module: spygar/commercetool/form/credential-field
        parent: pim-commercetool-credential-create-modal
        targetZone: fields
        position: 40
        config:
            identifier: client_id
            label: spygar_commercetool.credential.field.client_id

    pim-commercetool-credential-create-client-secret:
        module: spygar/commercetool/form/credential-field
        parent: pim-commercetool-credential-create-modal
        targetZone: fields
        position: 50
        config:
            identifier: client_secret
            label: Client secret
            plainLabel: true
            secret: true

    pim-commercetool-credential-create-region:
        module: spygar/commercetool/form/credential-field
        parent: pim-commercetool-credential-create-modal
        targetZone: fields
        position: 60
        config:
            identifier: region
            label: spygar_commercetool.credential.field.region
