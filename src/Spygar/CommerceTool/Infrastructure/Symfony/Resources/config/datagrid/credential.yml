datagrid:
    commercetool-credential-grid:
        extended_entity_name: Spygar\CommerceTool\Domain\Model\Credential
        options:
            entityHint: credential
            manageFilters: false
        source:
            acl_resource: spygar_commercetool_credential_index
            type: orm
            query:
                select:
                    - c.id
                    - c.code
                    - c.label
                    - c.projectKey
                    - c.clientId
                    - c.region
                    - c.active
                from:
                    - { table: Spygar\CommerceTool\Domain\Model\Credential, alias: c }
        columns:
            code:
                label: spygar_commercetool.credential.column.code
                frontend_type: label
            label:
                label: spygar_commercetool.credential.column.label
            projectKey:
                label: spygar_commercetool.credential.column.project_key
            clientId:
                label: spygar_commercetool.credential.column.client_id
            region:
                label: spygar_commercetool.credential.column.region
            active:
                label: spygar_commercetool.credential.column.active
                frontend_type: boolean-status
        properties:
            id: ~
            edit_link:
                type: url
                route: spygar_commercetool_credential_edit
                params:
                    identifier: code
            delete_link:
                type: url
                route: spygar_commercetool_credential_rest_remove
                params:
                    identifier: code
            toggle_link:
                type: url
                route: spygar_commercetool_credential_rest_toggle
                params:
                    identifier: code
        actions:
            enable:
                launcherOptions:
                    className: AknIconButton AknIconButton--small AknIconButton--switch
                type: enable-credential
                label: spygar_commercetool.credential.action.enable
                link: toggle_link
                acl_resource: spygar_commercetool_credential_edit
            edit:
                launcherOptions:
                    className: AknIconButton AknIconButton--small AknIconButton--edit
                type: navigate
                label: pim_common.edit
                link: edit_link
                rowAction: true
                acl_resource: spygar_commercetool_credential_edit
            delete:
                launcherOptions:
                    className: AknIconButton AknIconButton--small AknIconButton--trash
                type: delete
                label: pim_common.delete
                link: delete_link
                acl_resource: spygar_commercetool_credential_remove
        sorters:
            columns:
                code:
                    data_name: c.code
                label:
                    data_name: c.label
                projectKey:
                    data_name: c.projectKey
                clientId:
                    data_name: c.clientId
                region:
                    data_name: c.region
                active:
                    data_name: c.active
            default:
                code: '%oro_datagrid.extension.orm_sorter.class%::DIRECTION_ASC'
        filters:
            columns:
                code:
                    type: search
                    label: spygar_commercetool.credential.column.code
                    data_name: c.code
                label:
                    type: string
                    label: spygar_commercetool.credential.column.label
                    data_name: c.label
                projectKey:
                    type: string
                    label: spygar_commercetool.credential.column.project_key
                    data_name: c.projectKey
                active:
                    type: boolean
                    label: spygar_commercetool.credential.column.active
                    data_name: c.active
