spygar_commercetool_credential_rest_options:
    path: /options
    controller: spygar_commercetool.controller.credential::optionsAction
    methods: [GET]
    defaults:
        _feature: spygar_connectors

spygar_commercetool_credential_rest_toggle:
    path: /{identifier}/toggle
    controller: spygar_commercetool.controller.credential::toggleAction
    methods: [POST]
    requirements:
        identifier: '[a-zA-Z0-9_]+'
    defaults:
        _feature: spygar_connectors

spygar_commercetool_credential_rest_refresh:
    path: /{identifier}/refresh
    controller: spygar_commercetool.controller.credential::refreshAction
    methods: [POST]
    requirements:
        identifier: '[a-zA-Z0-9_]+'
    defaults:
        _feature: spygar_connectors

spygar_commercetool_credential_rest_create:
    path: ''
    controller: spygar_commercetool.controller.credential::createAction
    methods: [POST]
    defaults:
        _feature: spygar_connectors

spygar_commercetool_credential_rest_get:
    path: /{identifier}
    controller: spygar_commercetool.controller.credential::getAction
    methods: [GET]
    requirements:
        identifier: '[a-zA-Z0-9_]+'
    defaults:
        _feature: spygar_connectors

spygar_commercetool_credential_rest_post:
    path: /{identifier}
    controller: spygar_commercetool.controller.credential::postAction
    methods: [POST]
    requirements:
        identifier: '[a-zA-Z0-9_]+'
    defaults:
        _feature: spygar_connectors

spygar_commercetool_credential_rest_remove:
    path: /{identifier}
    controller: spygar_commercetool.controller.credential::removeAction
    methods: [DELETE]
    requirements:
        identifier: '[a-zA-Z0-9_]+'
    defaults:
        _feature: spygar_connectors
